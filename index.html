<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gestion Meubles — DuoDisplay</title>
<link rel="icon" href="logo.png" type="image/png">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f4f5f1; color: #293a34; padding: 12px; max-width: 1300px; margin: 0 auto; font-size: 13px; }
.header { display: flex; align-items: center; gap: 12px; margin-bottom: 15px; padding: 12px 18px; background: #293a34; border-radius: 6px; }
.header img { height: 38px; width: auto; }
.header h1 { font-size: 20px; font-weight: 700; color: #d7deca; letter-spacing: -0.5px; }
h2 { font-size: 15px; margin-bottom: 10px; color: #293a34; }
h3 { font-size: 12px; margin: 12px 0 8px; color: #5a6b62; text-transform: uppercase; letter-spacing: 0.5px; }
.card { background: white; border-radius: 6px; padding: 14px 16px; margin-bottom: 12px; border: 1px solid #e2e5dc; box-shadow: 0 1px 3px rgba(41,58,52,0.06); }
.stock-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 6px; }
.stock-row { display: flex; align-items: center; justify-content: space-between; padding: 7px 10px; background: #f9faf7; border-radius: 4px; border-left: 3px solid #d7deca; font-size: 12px; cursor: pointer; transition: background 0.15s; }
.stock-row:hover { background: #eef0ea; }
.stock-row.alerte { background: #fce8e8; border-left-color: #c0392b; }
.stock-row.alerte .stock-qte { color: #c0392b; font-weight: 700; }
.stock-row.desactive { cursor: not-allowed; opacity: 0.55; }
.stock-row.desactive:hover { background: #fce8e8; }
.stock-row:not(.desactive):hover { background: #e8f0e0; border-left-color: #4a7a4a; }
.stock-row.ajout-rapide { animation: flash 0.4s; }
@keyframes flash {
  0% { background: #c8d9c8; }
  100% { background: #f9faf7; }
}
.stock-name { flex: 1; margin-right: 10px; line-height: 1.3; min-width: 0; }
.stock-qte { font-size: 15px; font-weight: 700; min-width: 40px; text-align: right; }
.stock-sub { font-size: 10px; opacity: 0.6; }
/* ===== PHOTOS ARTICLES ===== */
.stock-photo { width: 42px; height: 42px; object-fit: cover; border-radius: 4px; margin-right: 10px; flex-shrink: 0; background: #e8ebe4; border: 1px solid #d7deca; }
.stock-photo-placeholder { width: 42px; height: 42px; display: flex; align-items: center; justify-content: center; font-size: 18px; color: #a8b0a5; background: #e8ebe4; border: 1px solid #d7deca; border-radius: 4px; margin-right: 10px; flex-shrink: 0; }
.form-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px; margin-bottom: 8px; }
.form-group { margin-bottom: 6px; }
.form-group label { display: block; font-size: 10px; color: #5a6b62; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.5px; font-weight: 600; }
input, select, button { width: 100%; padding: 8px 10px; border: 1px solid #c8cfc0; border-radius: 4px; font-size: 13px; font-family: inherit; background: white; color: #293a34; }
input:focus, select:focus { outline: none; border-color: #293a34; box-shadow: 0 0 0 2px rgba(41,58,52,0.1); }
button { background: #293a34; color: #d7deca; border: none; cursor: pointer; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; font-size: 11px; padding: 9px 14px; }
button:hover { background: #3a4f47; }
button:disabled { background: #a8b0a5; cursor: not-allowed; }
button.danger { background: #a12c2c; color: #f5e5e5; }
button.success { background: #4a7a4a; color: #e8f0e0; }
button.small { width: auto; padding: 4px 10px; font-size: 10px; }

/* ===== PANIER ===== */
.panier { background: #f9faf7; border: 1px solid #d7deca; border-radius: 4px; padding: 10px; min-height: 50px; margin-bottom: 10px; }
.panier-vide { color: #a8b0a5; font-size: 12px; font-style: italic; text-align: center; padding: 8px 0; }
.panier-item { display: grid; grid-template-columns: 40px 1fr auto auto; gap: 8px; align-items: center; padding: 6px 0; border-bottom: 1px solid #e8ebe4; }
.panier-item:last-child { border-bottom: none; }
.panier-item img,
.panier-item .stock-photo-placeholder { width: 32px; height: 32px; margin: 0; }
.panier-nom { font-size: 12px; line-height: 1.3; }
.panier-nom small { display: block; color: #5a6b62; font-size: 10px; }
.panier-qte { display: flex; align-items: center; gap: 3px; }
.panier-qte button { width: 24px; height: 24px; padding: 0; font-size: 14px; line-height: 1; font-weight: 700; }
.panier-qte input { width: 44px; text-align: center; padding: 3px; font-size: 12px; font-weight: 700; }
.panier-btn-x { background: #a12c2c; color: #f5e5e5; width: 26px; height: 26px; padding: 0; font-size: 11px; border-radius: 50%; }

table { width: 100%; border-collapse: collapse; font-size: 12px; }
th, td { padding: 7px; text-align: left; border-bottom: 1px solid #e8ebe4; }
th { font-weight: 700; color: #293a34; font-size: 10px; text-transform: uppercase; letter-spacing: 0.8px; background: #f4f5f1; border-bottom: 2px solid #293a34; }
tr.groupe-ligne { border-left: 4px solid #8ba888; cursor: pointer; transition: background 0.15s; }
tr.groupe-ligne:hover { background: #f9faf7; }
tr.groupe-ligne td:first-child { font-weight: 600; }
tr.groupe-ligne.ouvert { background: #f0f3ec; }
.expand-icon { display: inline-block; width: 16px; height: 16px; line-height: 16px; text-align: center; background: #d7deca; border-radius: 3px; font-size: 10px; margin-right: 6px; color: #293a34; transition: transform 0.15s; user-select: none; }
.expand-icon.open { transform: rotate(90deg); }
tr.details-ligne { background: #f9faf7; display: none; }
tr.details-ligne.open { display: table-row; }
tr.details-ligne td { padding: 8px 16px; font-size: 11px; color: #5a6b62; border-bottom: 1px solid #e8ebe4; }
tr.details-ligne table { font-size: 11px; }
tr.details-ligne th, tr.details-ligne td { padding: 4px 8px; border: none; text-transform: none; letter-spacing: 0; background: none; color: #5a6b62; font-weight: normal; }
tr.details-ligne tr:first-child th { font-weight: 700; color: #293a34; font-size: 10px; border-bottom: 1px solid #c8cfc0; }
.badge { display: inline-block; padding: 3px 7px; border-radius: 3px; font-size: 10px; font-weight: 700; text-transform: uppercase; }
.badge.reserve { background: #f0e6c8; color: #6b5a1e; }
.badge.confirme { background: #d7deca; color: #293a34; }
.badge.termine { background: #c8d9c8; color: #2c4a2c; }
.actions { display: flex; gap: 4px; flex-wrap: wrap; }
.message { padding: 10px; border-radius: 4px; margin-bottom: 12px; font-size: 12px; }
.message.success { background: #d7deca; color: #293a34; border-left: 4px solid #4a7a4a; padding: 12px 15px; line-height: 1.5; }
.message.error { background: #f5d7d7; color: #842029; border-left: 4px solid #c0392b; padding: 12px 15px; font-size: 13px; line-height: 1.5; box-shadow: 0 2px 8px rgba(192, 57, 43, 0.15); }
.message.error strong { color: #842029; display: block; margin-bottom: 4px; }
.message.error em { color: #5a3c3c; font-style: italic; font-size: 12px; }
.loading { text-align: center; padding: 15px; color: #5a6b62; font-size: 12px; }
.spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid #d7deca; border-top-color: #293a34; border-radius: 50%; animation: spin 0.8s linear infinite; vertical-align: middle; margin-right: 6px; }
@keyframes spin { to { transform: rotate(360deg); } }
.empty { text-align: center; padding: 15px; color: #5a6b62; font-size: 12px; }
.filtre { max-width: 240px; margin-bottom: 10px; font-size: 12px; }
.legende { font-size: 10px; color: #5a6b62; margin-bottom: 8px; }
.recherche-stock { max-width: 300px; margin-bottom: 10px; }

/* ===== MODALE D'IMAGE ===== */
.image-modal { display: none; position: fixed; z-index: 9999; top: 0; left: 0; right: 0; bottom: 0; background: rgba(41, 58, 52, 0.92); align-items: center; justify-content: center; flex-direction: column; padding: 20px; cursor: zoom-out; animation: fadeIn 0.15s; }
.image-modal.open { display: flex; }
.image-modal img { max-width: 90vw; max-height: 82vh; width: auto; height: auto; object-fit: contain; border-radius: 6px; box-shadow: 0 10px 40px rgba(0,0,0,0.5); background: white; cursor: default; }
.image-modal-close { position: absolute; top: 18px; right: 24px; font-size: 32px; color: #d7deca; cursor: pointer; font-weight: 300; line-height: 1; user-select: none; transition: transform 0.15s; }
.image-modal-close:hover { transform: scale(1.15); }
.image-modal-titre { margin-top: 14px; color: #d7deca; font-size: 13px; text-align: center; max-width: 80vw; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
</style>
</head>
<body>

<div class="header">
  <img src="logo.png" alt="DuoDisplay" onerror="this.style.display='none'">
  <h1>Gestion Meubles</h1>
</div>

<div id="message"></div>

<div class="card">
  <h2>📦 Stock disponible
    <span style="font-size:11px;color:#5a6b62;font-weight:400;margin-left:8px;">
      <input type="date" id="dateVerifDebut" style="width:130px;display:inline-block;padding:4px 6px;font-size:11px;">
      →
      <input type="date" id="dateVerifFin" style="width:130px;display:inline-block;padding:4px 6px;font-size:11px;">
      <button class="small" onclick="chargerStock()" style="margin-left:6px;">Vérifier</button>
    </span>
  </h2>
  <input type="text" class="recherche-stock" id="rechercheStock" placeholder="🔍 Rechercher un meuble..." oninput="afficherStock()">
  <div id="stockGrid" class="stock-grid">
    <div class="loading"><span class="spinner"></span>Chargement...</div>
  </div>
</div>

<div class="card">
  <h2>➕ Nouvelle réservation</h2>
  <div class="form-row">
    <div class="form-group">
      <label>Client</label>
      <input type="text" id="client" placeholder="Nom du client">
    </div>
    <div class="form-group">
      <label>Date de début</label>
      <input type="date" id="debut" onchange="rafraichirDispoPourPanier()">
    </div>
    <div class="form-group">
      <label>Date de fin</label>
      <input type="date" id="fin" onchange="rafraichirDispoPourPanier()">
    </div>
  </div>

  <h3>🛒 Panier</h3>
  <div id="panier" class="panier">
    <div class="panier-vide">Cliquez sur un meuble dans la liste du stock pour l'ajouter au panier.</div>
  </div>

  <div style="margin-top:12px;">
    <button id="btnResa" onclick="validerReservation()">Réserver</button>
  </div>
</div>

<div class="card">
  <h2>📋 Réservations
    <button class="small" onclick="chargerReservations()" style="margin-left:8px;">🔄 Rafraîchir</button>
  </h2>
  <div class="legende">Cliquez sur une ligne pour afficher le détail des articles</div>
  <input type="text" class="filtre" id="filtreClient" placeholder="Filtrer par client..." oninput="afficherReservations()">
  <div id="tableReservations" class="loading"><span class="spinner"></span>Chargement...</div>
</div>

<!-- 🖼️ Modale d'agrandissement d'image -->
<div id="imageModal" class="image-modal" onclick="fermerImage(event)">
  <span class="image-modal-close" onclick="fermerImage(event)">✕</span>
  <img id="imageModalImg" src="" alt="">
  <div id="imageModalTitre" class="image-modal-titre"></div>
</div>

<script>
/* ============================================================
   CONFIGURATION
   ============================================================ */
const API_URL = "https://script.google.com/macros/s/AKfycbxfsCiC0ZwMSvPuWBOZw4QOwhPZmQxVgHngvJN36wEk4ULvKR-K3XsuwNARU8ZNjQmI/exec";
const PHOTOS_BASE = "photos/";

/* ============================================================
   ÉTAT GLOBAL
   ============================================================ */
let reservationsCache = [];
let inventaireCache = [];
let dispoCache = [];
let panier = [];

/* ============================================================
   UTILITAIRES
   ============================================================ */
function formatDate(date) {
  return date.getFullYear() + "-" +
         String(date.getMonth() + 1).padStart(2, '0') + "-" +
         String(date.getDate()).padStart(2, '0');
}
function aujourdhui() { return formatDate(new Date()); }

function afficherMessage(texte, type) {
  const el = document.getElementById('message');
  const txt = (texte === undefined || texte === null) ? "Erreur inconnue" : String(texte);
  el.innerHTML = '<div class="message ' + type + '">' + txt + '</div>';
  const duree = (type === 'error') ? 15000 : 6000;
  setTimeout(function() { el.innerHTML = ''; }, duree);
  if (type === 'error') window.scrollTo({ top: 0, behavior: 'smooth' });
}

function escapeHtml(s) {
  return String(s || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

function escapeJs(s) {
  return String(s || "")
    .replace(/\\/g, "\\\\")
    .replace(/'/g, "\\'")
    .replace(/"/g, '\\"')
    .replace(/\n/g, "\\n");
}

/* ============================================================
   COMMUNICATION API
   ============================================================ */
function fetchJSON(url, tentatives) {
  tentatives = tentatives || 3;
  return fetch(url, { redirect: 'follow' })
    .then(function(r) { return r.text(); })
    .then(function(text) {
      if (text.trim().startsWith("<")) throw new Error("HTML_RESPONSE");
      try { return JSON.parse(text); } catch (e) { throw new Error("PARSE_ERROR"); }
    })
    .catch(function(err) {
      if (tentatives > 1 && (err.message === "HTML_RESPONSE" || err.message === "PARSE_ERROR")) {
        return new Promise(function(resolve) { setTimeout(resolve, 1000); })
          .then(function() { return fetchJSON(url, tentatives - 1); });
      }
      throw err;
    });
}

function appelAPI(action, methode, data) {
  let url = API_URL;
  let options = { redirect: 'follow' };
  if (methode === 'POST') {
    options.method = 'POST';
    options.headers = { 'Content-Type': 'text/plain;charset=utf-8' };
    options.body = JSON.stringify(data);
    return fetch(url, options)
      .then(function(r) { return r.text(); })
      .then(function(text) {
        if (text.trim().startsWith("<")) throw new Error("HTML_RESPONSE");
        try { return JSON.parse(text); }
        catch (e) { throw new Error("Réponse invalide"); }
      });
  } else {
    url += '?action=' + action;
    return fetchJSON(url);
  }
}

/* ============================================================
   GESTION DES PHOTOS
   ============================================================ */
function urlPhotoThumb(nomImage) {
  if (!nomImage) return "";
  return PHOTOS_BASE + "thumbs/" + nomImage;
}
function urlPhotoFull(nomImage) {
  if (!nomImage) return "";
  return PHOTOS_BASE + "full/" + nomImage;
}

const SVG_PLACEHOLDER = 'data:image/svg+xml;utf8,' +
  '<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200">' +
  '<rect width="100%" height="100%" fill="%23e8ebe4"/>' +
  '<text x="50%" y="50%" font-size="80" text-anchor="middle" dy=".3em" fill="%23a8b0a5">📦</text>' +
  '</svg>';

function afficherImage(nomImage, designation) {
  if (!nomImage) return;
  const modal = document.getElementById('imageModal');
  const img = document.getElementById('imageModalImg');
  const titre = document.getElementById('imageModalTitre');
  img.src = urlPhotoFull(nomImage);
  img.onerror = function() {
    this.onerror = function() { this.src = SVG_PLACEHOLDER; };
    this.src = urlPhotoThumb(nomImage);
  };
  titre.textContent = designation || nomImage;
  modal.classList.add('open');
  document.body.style.overflow = 'hidden';
}

function fermerImage(event) {
  if (event && event.target.id === 'imageModalImg') return;
  const modal = document.getElementById('imageModal');
  modal.classList.remove('open');
  document.body.style.overflow = '';
}

document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') fermerImage();
});

/* ============================================================
   STOCK — affichage avec clic → panier
   ============================================================ */
function chargerStock() {
  const debut = document.getElementById('dateVerifDebut').value || aujourdhui();
  const fin = document.getElementById('dateVerifFin').value || aujourdhui();
  const el = document.getElementById('stockGrid');
  el.innerHTML = '<div class="loading"><span class="spinner"></span>Chargement...</div>';
  const url = API_URL + '?action=disponibilite&debut=' + debut + '&fin=' + fin + '&t=' + Date.now();
  fetchJSON(url)
    .then(function(data) {
      dispoCache = data;
      afficherStock();
    })
    .catch(function(err) {
      el.innerHTML = '<div class="message error">Erreur : ' + escapeHtml(err.message) + '</div>';
    });
}

function afficherStock() {
  const el = document.getElementById('stockGrid');
  const filtre = (document.getElementById('rechercheStock').value || "").toLowerCase();
  let html = '';
  let count = 0;

  dispoCache.forEach(function(item) {
    const typeLower = item.type.toLowerCase();
    const idLower = item.id.toLowerCase();
    if (filtre && typeLower.indexOf(filtre) === -1 && idLower.indexOf(filtre) === -1) return;
    count++;

    const desactive = item.alerte;
    const cls = 'stock-row' + (item.alerte ? ' alerte' : '') + (desactive ? ' desactive' : '');

    let qteAffichage, sousTitre;
    if (item.invalide) {
      qteAffichage = '⚠️';
      sousTitre = 'Quantité invalide dans le tableau';
    } else if (item.total > 0 && item.disponible === 0) {
      qteAffichage = '0';
      sousTitre = 'Tout le stock est réservé sur cette période';
    } else {
      qteAffichage = item.disponible;
      sousTitre = escapeHtml(item.id) + ' • sur ' + item.total + ' en stock';
    }

    let photoHtml;
    if (item.nomImage) {
      photoHtml = '<img class="stock-photo" src="' + escapeHtml(urlPhotoThumb(item.nomImage)) + '" alt="" loading="lazy" ' +
                  'onerror="this.outerHTML=\'<div class=&quot;stock-photo-placeholder&quot;>📦</div>\'">';
    } else {
      photoHtml = '<div class="stock-photo-placeholder">📦</div>';
    }

    // ✨ Clic gauche = ajout panier ; clic sur la photo = agrandir
    let clickAttr = '';
    let titleAttr = '';
    if (desactive) {
      titleAttr = 'title="Indisponible sur cette période"';
    } else {
      clickAttr = 'onclick="ajouterAuPanier(\'' + escapeJs(item.id) + '\')"';
      titleAttr = 'title="Cliquer pour ajouter au panier"';
    }

    // Photo cliquable pour agrandir (uniquement si image existe)
    let photoClickAttr = '';
    if (item.nomImage) {
      photoClickAttr = 'onclick="event.stopPropagation();afficherImage(\'' + escapeJs(item.nomImage) + '\', \'' + escapeJs(item.type) + '\')" ' +
                       'style="cursor:zoom-in;" title="Cliquer pour agrandir"';
    }

    html += '<div class="' + cls + '" id="stock-row-' + escapeHtml(item.id) + '" ' + clickAttr + ' ' + titleAttr + '>';
    html += '<span ' + photoClickAttr + '>' + photoHtml + '</span>';
    html += '<div class="stock-name">' + escapeHtml(item.type) +
            '<div class="stock-sub">' + sousTitre + '</div></div>';
    html += '<div class="stock-qte">' + qteAffichage + '</div>';
    html += '</div>';
  });

  if (count === 0) html = '<div class="empty">Aucun meuble trouvé</div>';
  el.innerHTML = html;
}

/* ============================================================
   INVENTAIRE
   ============================================================ */
function chargerInventaire() {
  if (inventaireCache.length > 0) return Promise.resolve();
  return appelAPI('inventaire', 'GET').then(function(data) {
    inventaireCache = data;
  });
}

/* ============================================================
   PANIER
   ============================================================ */
function ajouterAuPanier(id) {
  const dispoItem = dispoCache.find(function(d) { return d.id === id; });
  if (!dispoItem) return;
  if (dispoItem.alerte) {
    afficherMessage('❌ Cet article n\'est pas disponible sur la période choisie', 'error');
    return;
  }

  const existant = panier.find(function(p) { return p.id === id; });
  if (existant) {
    if (existant.quantite >= dispoItem.disponible) {
      afficherMessage('⚠️ Quantité maximale atteinte pour « ' + escapeHtml(dispoItem.type) + ' » (' + dispoItem.disponible + ')', 'error');
      return;
    }
    existant.quantite++;
  } else {
    panier.push({
      id: id,
      type: dispoItem.type,
      nomImage: dispoItem.nomImage,
      quantite: 1,
      maxDispo: dispoItem.disponible
    });
  }

  const row = document.getElementById('stock-row-' + id);
  if (row) {
    row.classList.add('ajout-rapide');
    setTimeout(function() { row.classList.remove('ajout-rapide'); }, 400);
  }

  afficherPanier();
}

function retirerDuPanier(id) {
  panier = panier.filter(function(p) { return p.id !== id; });
  afficherPanier();
}

function changerQtePanier(id, delta) {
  const item = panier.find(function(p) { return p.id === id; });
  if (!item) return;
  const nouvelle = item.quantite + delta;
  if (nouvelle < 1) { retirerDuPanier(id); return; }
  if (nouvelle > item.maxDispo) {
    afficherMessage('⚠️ Maximum disponible : ' + item.maxDispo + ' pour « ' + escapeHtml(item.type) + ' »', 'error');
    return;
  }
  item.quantite = nouvelle;
  afficherPanier();
}

function setQtePanier(id, valeur) {
  const item = panier.find(function(p) { return p.id === id; });
  if (!item) return;
  let v = parseInt(valeur) || 1;
  if (v < 1) v = 1;
  if (v > item.maxDispo) {
    afficherMessage('⚠️ Maximum disponible : ' + item.maxDispo + ' pour « ' + escapeHtml(item.type) + ' »', 'error');
    v = item.maxDispo;
  }
  item.quantite = v;
  afficherPanier();
}

function afficherPanier() {
  const el = document.getElementById('panier');
  if (panier.length === 0) {
    el.innerHTML = '<div class="panier-vide">Cliquez sur un meuble dans la liste du stock pour l\'ajouter au panier.</div>';
    return;
  }

  let html = '';
  panier.forEach(function(item) {
    let photoHtml;
    if (item.nomImage) {
      photoHtml = '<img src="' + escapeHtml(urlPhotoThumb(item.nomImage)) + '" alt="" ' +
                  'onerror="this.outerHTML=\'<div class=&quot;stock-photo-placeholder&quot;>📦</div>\'">';
    } else {
      photoHtml = '<div class="stock-photo-placeholder">📦</div>';
    }

    html += '<div class="panier-item">';
    html += photoHtml;
    html += '<div class="panier-nom">' + escapeHtml(item.type) +
            '<small>Dispo max : ' + item.maxDispo + '</small></div>';
    html += '<div class="panier-qte">';
    html += '<button onclick="changerQtePanier(\'' + escapeJs(item.id) + '\', -1)">−</button>';
    html += '<input type="number" min="1" max="' + item.maxDispo + '" value="' + item.quantite + '" ' +
            'onchange="setQtePanier(\'' + escapeJs(item.id) + '\', this.value)">';
    html += '<button onclick="changerQtePanier(\'' + escapeJs(item.id) + '\', 1)">+</button>';
    html += '</div>';
    html += '<button class="panier-btn-x" onclick="retirerDuPanier(\'' + escapeJs(item.id) + '\')" title="Retirer">✕</button>';
    html += '</div>';
  });
  el.innerHTML = html;
}

function rafraichirDispoPourPanier() {
  if (panier.length === 0) return;

  const debut = document.getElementById('debut').value;
  const fin = document.getElementById('fin').value;
  if (!debut || !fin) return;

  const url = API_URL + '?action=disponibilite&debut=' + debut + '&fin=' + fin + '&t=' + Date.now();
  fetchJSON(url).then(function(data) {
    const nouvelleDispo = {};
    data.forEach(function(d) { nouvelleDispo[d.id] = d; });

    const nouveaux = [];
    let avertissement = false;
    panier.forEach(function(p) {
      const nd = nouvelleDispo[p.id];
      if (!nd || nd.alerte) { avertissement = true; return; }
      p.maxDispo = nd.disponible;
      if (p.quantite > nd.disponible) {
        p.quantite = nd.disponible;
        avertissement = true;
      }
      nouveaux.push(p);
    });
    panier = nouveaux;
    if (avertissement) afficherMessage('⚠️ Certains articles du panier ont été ajustés ou retirés suite au changement de dates', 'error');
    afficherPanier();
  });
}

/* ============================================================
   VALIDATION RÉSERVATION
   ============================================================ */
function validerReservation() {
  const client = document.getElementById('client').value.trim();
  const debut = document.getElementById('debut').value;
  const fin = document.getElementById('fin').value;

  if (!client || !debut || !fin) {
    afficherMessage('Veuillez remplir le client et les dates', 'error');
    return;
  }
  if (panier.length === 0) {
    afficherMessage('Cliquez sur au moins un meuble dans le stock pour l\'ajouter au panier', 'error');
    return;
  }

  const btn = document.getElementById('btnResa');
  btn.disabled = true;
  btn.textContent = 'Envoi...';

  const payload = {
    action: 'creerReservation',
    client: client,
    articles: panier.map(function(p) { return { id: p.id, quantite: p.quantite }; }),
    debut: debut,
    fin: fin
  };

  appelAPI('creerReservation', 'POST', payload)
    .then(function(res) {
      if (res && res.succes) {
        afficherMessage('✅ ' + escapeHtml(res.message || 'Réservation créée'), 'success');
        document.getElementById('client').value = '';
        document.getElementById('debut').value = '';
        document.getElementById('fin').value = '';
        panier = [];
        afficherPanier();
        chargerStock();
        chargerReservations();
      } else {
        const msg = (res && res.message) ? res.message : "Réservation impossible";
        let messageComplet = '❌ <strong>Réservation refusée</strong><br>' + escapeHtml(msg);
        if (msg.toLowerCase().indexOf('insuffisant') !== -1) {
          messageComplet += '<br><br>👉 <em>Conseil : vérifiez la disponibilité pour cette période, ou réduisez la quantité / changez les dates.</em>';
        } else if (msg.toLowerCase().indexOf('invalide') !== -1) {
          messageComplet += '<br><br>👉 <em>Conseil : la quantité de cet article est invalide dans l\'inventaire.</em>';
        }
        afficherMessage(messageComplet, 'error');
      }
    })
    .catch(function(err) {
      if (err.message === 'HTML_RESPONSE') {
        afficherMessage('❌ <strong>Erreur de connexion</strong><br>Le serveur ne répond pas correctement.', 'error');
      } else {
        afficherMessage('❌ <strong>Erreur</strong> : ' + escapeHtml(err.message), 'error');
      }
    })
    .finally(function() {
      btn.disabled = false;
      btn.textContent = 'Réserver';
    });
}

/* ============================================================
   RÉSERVATIONS
   ============================================================ */
function chargerReservations() {
  const el = document.getElementById('tableReservations');
  el.innerHTML = '<div class="loading"><span class="spinner"></span>Chargement...</div>';

  const promises = [];
  if (inventaireCache.length === 0) promises.push(chargerInventaire());

  Promise.all(promises).then(function() {
    return appelAPI('reservations', 'GET');
  }).then(function(data) {
    reservationsCache = data;
    afficherReservations();
  }).catch(function(err) {
    el.innerHTML = '<div class="message error">Erreur : ' + escapeHtml(err.message) + '</div>';
  });
}

function afficherReservations() {
  const el = document.getElementById('tableReservations');
  const filtre = document.getElementById('filtreClient').value.toLowerCase();

  const typeParId = {};
  const imageParId = {};
  inventaireCache.forEach(function(item) {
    typeParId[item.id] = item.type;
    imageParId[item.id] = item.nomImage;
  });

  const groupes = {};
  reservationsCache.forEach(function(r) {
    if (r.statut === 'Annulé') return;
    if (filtre && r.client.toLowerCase().indexOf(filtre) === -1) return;
    const g = r.groupe || 'sans-groupe-' + r.id;
    if (!groupes[g]) groupes[g] = [];
    groupes[g].push(r);
  });

  const groupesTries = Object.keys(groupes).sort(function(a, b) {
    return groupes[a][0].debut.localeCompare(groupes[b][0].debut);
  });

  let html = '<table><thead><tr>';
  html += '<th style="width:50%;">Client / Articles</th><th>Qté</th><th>Début</th><th>Fin</th><th>Statut</th><th>Actions</th>';
  html += '</tr></thead><tbody>';

  let count = 0;
  groupesTries.forEach(function(g) {
    const lignes = groupes[g];
    const premiere = lignes[0];
    count++;

    let badgeClass = 'reserve';
    if (premiere.statut === 'Confirmé') badgeClass = 'confirme';
    else if (premiere.statut === 'Terminé') badgeClass = 'termine';

    const totalArticles = lignes.reduce(function(sum, l) { return sum + l.quantite; }, 0);

    html += '<tr class="groupe-ligne" id="row-' + g + '" onclick="toggleGroupe(\'' + g + '\')">';
    html += '<td><span class="expand-icon" id="icon-' + g + '">▶</span>';
    html += '<strong>' + escapeHtml(premiere.client) + '</strong>';
    html += ' <span style="color:#5a6b62;font-size:11px;font-weight:normal;">(' + lignes.length + ' article' + (lignes.length > 1 ? 's' : '') + ')</span></td>';
    html += '<td>' + totalArticles + '</td><td>' + premiere.debut + '</td><td>' + premiere.fin + '</td>';
    html += '<td><span class="badge ' + badgeClass + '">' + escapeHtml(premiere.statut) + '</span></td>';
    html += '<td class="actions">';
    if (premiere.statut === 'Réservé') {
      html += '<button class="small success" onclick="event.stopPropagation();changerStatutGroupe(\'' + escapeJs(g) + '\', \'Confirmé\')">Confirmer</button>';
      html += '<button class="small danger" onclick="event.stopPropagation();changerStatutGroupe(\'' + escapeJs(g) + '\', \'Annulé\')">Annuler</button>';
    } else if (premiere.statut === 'Confirmé') {
      html += '<button class="small danger" onclick="event.stopPropagation();changerStatutGroupe(\'' + escapeJs(g) + '\', \'Annulé\')">Annuler</button>';
    } else if (premiere.statut === 'Terminé') {
      html += '<button class="small success" onclick="event.stopPropagation();validerRetour(\'' + escapeJs(g) + '\')">✅ Valider le retour</button>';
    }
    html += '</td></tr>';

    html += '<tr class="details-ligne" id="det-' + g + '"><td colspan="6">';
    html += '<table><thead><tr><th style="width:50px;">Photo</th><th>Article</th><th>Quantité</th></tr></thead><tbody>';
    lignes.forEach(function(l) {
      const designation = typeParId[l.materiel] || l.materiel;
      const nomImg = imageParId[l.materiel];
      let photoCell;
      if (nomImg) {
        photoCell = '<img class="stock-photo" src="' + escapeHtml(urlPhotoThumb(nomImg)) + '" alt="" loading="lazy" ' +
                    'style="cursor:zoom-in;" ' +
                    'onclick="event.stopPropagation();afficherImage(\'' + escapeJs(nomImg) + '\', \'' + escapeJs(designation) + '\')" ' +
                    'onerror="this.outerHTML=\'<div class=&quot;stock-photo-placeholder&quot;>📦</div>\'">';
      } else {
        photoCell = '<div class="stock-photo-placeholder">📦</div>';
      }
      html += '<tr><td>' + photoCell + '</td><td>' + escapeHtml(designation) + '</td><td>' + l.quantite + '</td></tr>';
    });
    html += '</tbody></table></td></tr>';
  });

  if (count === 0) html += '<tr><td colspan="6" class="empty">Aucune réservation</td></tr>';
  html += '</tbody></table>';
  el.innerHTML = html;
}

function toggleGroupe(g) {
  const det = document.getElementById('det-' + g);
  const icon = document.getElementById('icon-' + g);
  const row = document.getElementById('row-' + g);
  if (det) det.classList.toggle('open');
  if (icon) icon.classList.toggle('open');
  if (row) row.classList.toggle('ouvert');
}

function changerStatutGroupe(groupe, statut) {
  let message;
  if (statut === 'Annulé') {
    message = '⚠️ ATTENTION : Cette action va SUPPRIMER DÉFINITIVEMENT toutes les lignes de ce groupe.\n\nContinuer ?';
  } else {
    message = 'Passer toutes les lignes de ce groupe au statut "' + statut + '" ?';
  }
  if (!confirm(message)) return;

  appelAPI('changerStatutGroupe', 'POST', {action: 'changerStatutGroupe', groupe: groupe, statut: statut})
    .then(function(res) {
      if (res && res.succes) {
        afficherMessage('✅ ' + escapeHtml(res.message), 'success');
        chargerReservations();
        chargerStock();
      } else {
        afficherMessage('❌ ' + escapeHtml(res && res.message ? res.message : "Erreur"), 'error');
      }
    });
}

function validerRetour(groupe) {
  if (!confirm('⚠️ ATTENTION : Cette action va SUPPRIMER DÉFINITIVEMENT toutes les lignes de ce groupe.\n\nLe matériel est bien revenu en stock ?\n\nContinuer ?')) return;

  appelAPI('changerStatutGroupe', 'POST', {action: 'changerStatutGroupe', groupe: groupe, statut: 'Supprimer'})
    .then(function(res) {
      if (res && res.succes) {
        afficherMessage('✅ ' + escapeHtml(res.message), 'success');
        chargerReservations();
        chargerStock();
      } else {
        afficherMessage('❌ ' + escapeHtml(res && res.message ? res.message : "Erreur"), 'error');
      }
    });
}

  const auj = aujourdhui();
  document.getElementById('dateVerifDebut').value = auj;
  document.getElementById('dateVerifFin').value = auj;
  chargerStock();
  chargerReservations();
  chargerInventaire();
